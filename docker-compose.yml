services:
  db:
    image: mariadb:10.6
    container_name: plantravel_db
    restart: always
    environment:
      MYSQL_DATABASE: plantravel5
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: plantravel_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PASSWORD=root

  frontend:
    build: ./frontend
    container_name: plantravel_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    stdin_open: true
    tty: true

volumes:
  db_data: